name: Pubblica app web

# A ogni push su main ricostruisce la versione web (PWA) e la pubblica su GitHub Pages:
# https://marco02-hub.github.io/dove-la-vedo/
# I dati (data/matches.json) l'app li scarica a parte, quindi aggiornarli non richiede una nuova pubblicazione.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      # GitHub Pages non conosce le rotte dell'app: 404.html = index.html fa funzionare anche i link diretti
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
