name: Aggiorna partite

# Solo avvio manuale: per ora i dati si aggiornano a mano con Claude Code (vedi CLAUDE.md).
# Per riattivare l'aggiornamento automatico (serve il secret ANTHROPIC_API_KEY, a pagamento):
#   schedule:
#     - cron: '0 5 * * *'   # 07:00 ora svizzera d'estate
#     - cron: '0 15 * * *'  # 17:00 ora svizzera d'estate
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Versioni bloccate dal lockfile (stesso SDK usato in locale)
      - run: npm ci --ignore-scripts
      - run: node backend/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit se ci sono cambiamenti
        run: |
          git config user.name "dove-la-vedo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/matches.json
          git diff --cached --quiet || git commit -m "Aggiorna partite $(date -u +%F)"
          git push
