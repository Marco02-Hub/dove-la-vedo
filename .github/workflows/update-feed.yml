name: Aggiorna partite

# Ogni 6 ore legge calendario e canali da fonti pubbliche gratuite (backend/auto-update.mjs)
# e salva data/matches.json. Nessuna chiave o servizio a pagamento.
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Lo script non ha dipendenze: niente npm install
      - run: node backend/auto-update.mjs
      - name: Commit se ci sono cambiamenti
        run: |
          git config user.name "dove-la-vedo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/matches.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna partite $(date -u +%F_%H%M)"
          git pull --rebase -q origin main
          git push
